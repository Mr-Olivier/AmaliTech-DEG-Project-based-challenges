name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "dev-ops/DeployReady/**"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kora-analytics-api

jobs:
  # step 1 — run tests first. if they fail, nothing gets built or deployed
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # check out the code
      - uses: actions/checkout@v4

      # use node 20 to match the container image
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dev-ops/DeployReady/app/package-lock.json

      # install dependencies including jest and supertest
      - name: Install dependencies
        run: npm ci
        working-directory: dev-ops/DeployReady/app

      # run the test suite — pipeline stops here if any test fails
      - name: Run tests
        run: npm test
        working-directory: dev-ops/DeployReady/app

  # step 2 — build the Docker image and push it to ECR
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      # check out the code
      - uses: actions/checkout@v4

      # log in to AWS using credentials stored in GitHub secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # get a short-lived login token for ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # build and tag the image with the commit SHA so every push is traceable
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            dev-ops/DeployReady/

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # step 3 — pull the new image on the server, restart the container, check /health
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # ssh into the EC2 server and run the deploy script
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NEW_IMAGE,AWS_REGION
          script: |
            # log in to ECR using the server's IAM role — no credentials stored on disk
            ECR_REGISTRY=$(echo $NEW_IMAGE | cut -d'/' -f1)
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # save the current image tag so we can roll back to it if needed
            PREV_IMAGE=$(docker inspect kora-api --format='{{.Config.Image}}' 2>/dev/null || echo "")

            # pull the new image
            docker pull $NEW_IMAGE

            # stop and remove the old container, then start the new one
            docker stop kora-api 2>/dev/null || true
            docker rm   kora-api 2>/dev/null || true
            docker run -d \
              --name kora-api \
              -p 80:3000 \
              -e PORT=3000 \
              --restart unless-stopped \
              $NEW_IMAGE

            # wait for the app to start, then check /health
            sleep 15
            if curl -sf http://localhost/health; then
              echo "Deploy succeeded"
              [ -n "$PREV_IMAGE" ] && docker rmi "$PREV_IMAGE" 2>/dev/null || true
            else
              # health check failed — bring the old container back
              echo "Health check failed, rolling back"
              docker stop kora-api 2>/dev/null || true
              docker rm   kora-api 2>/dev/null || true
              if [ -n "$PREV_IMAGE" ]; then
                docker run -d \
                  --name kora-api \
                  -p 80:3000 \
                  -e PORT=3000 \
                  --restart unless-stopped \
                  "$PREV_IMAGE"
                echo "Rolled back to $PREV_IMAGE"
              fi
              exit 1
            fi
