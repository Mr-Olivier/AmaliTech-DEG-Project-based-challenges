name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "dev-ops/DeployReady/**"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: kora-analytics-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # check out the code
      - uses: actions/checkout@v4

      # use v20 to match node:20-alpine in the Dockerfile
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dev-ops/DeployReady/app/package-lock.json

      # install jest and supertest
      - name: Install dependencies
        run: npm ci
        working-directory: dev-ops/DeployReady/app

      # stops the pipeline here if any test fails
      - name: Run tests
        run: npm test
        working-directory: dev-ops/DeployReady/app

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      # check out the code
      - uses: actions/checkout@v4

      # authenticate the runner with AWS using repository secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # exchange AWS credentials for a short-lived ECR login token
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # tag with the commit SHA so each deploy is traceable in ECR
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            dev-ops/DeployReady/

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # re-authenticate — this is a separate job from build-and-push
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # temporarily open port 22 for this runner's IP only — closed again in the final step
      - name: Open SSH port for this runner
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)/32
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 --cidr $RUNNER_IP

      # pull the new image, swap containers, roll back if /health fails
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NEW_IMAGE,AWS_REGION
          script: |
            ECR_REGISTRY=$(echo $NEW_IMAGE | cut -d'/' -f1)
            # uses the server's IAM role — no static credentials on disk
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            PREV_IMAGE=$(docker inspect kora-api --format='{{.Config.Image}}' 2>/dev/null || echo "")

            docker pull $NEW_IMAGE

            docker stop kora-api 2>/dev/null || true
            docker rm   kora-api 2>/dev/null || true
            docker run -d \
              --name kora-api \
              -p 80:3000 \
              -e PORT=3000 \
              --restart unless-stopped \
              $NEW_IMAGE

            sleep 15
            if curl -sf http://localhost/health; then
              echo "Deploy succeeded"
              [ -n "$PREV_IMAGE" ] && docker rmi "$PREV_IMAGE" 2>/dev/null || true
            else
              echo "Health check failed, rolling back"
              docker stop kora-api 2>/dev/null || true
              docker rm   kora-api 2>/dev/null || true
              if [ -n "$PREV_IMAGE" ]; then
                docker run -d \
                  --name kora-api \
                  -p 80:3000 \
                  -e PORT=3000 \
                  --restart unless-stopped \
                  "$PREV_IMAGE"
                echo "Rolled back to $PREV_IMAGE"
              fi
              exit 1
            fi

      # always runs — removes the firewall rule even if deploy failed
      - name: Close SSH port
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ env.RUNNER_IP }}
